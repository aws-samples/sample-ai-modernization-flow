# ATX transform-config テンプレート — CCA (Comprehensive Codebase Analysis)
# Playbook: dotnetfw-to-modern-dotnet
#
# install.sh がこれを 00-analysis/transform-config-cca-template.yaml として設置する。
# Phase 0a-4 でリポジトリごとに 00-analysis/<repo-id>/transform-config-cca.yaml へコピーし、
# <PLACEHOLDER> を埋めてから使う。
#
# 実行は必ず「記録リポジトリのルート」で行う（codeRepositoryPath がそこからの相対パスであるため）:
#   cd <MIGRATION_PROJECT_DIR>
#   atx custom def exec -g file://00-analysis/<repo-id>/transform-config-cca.yaml -x -t \
#     > 00-analysis/<repo-id>/cca-run.log 2>&1
#
# 実行前に必ずパスの実在を確認して結果をコメントに残す（CP-12: FS に問い合わせた結果を鵜呑みにしない）:
#   realpath <CODE_REPOSITORY_PATH>
#
# ⚠️ additionalPlanContext は 4096 バイト以内（ATX の上限）。**プレースホルダを埋めた後に測る。**
#   テンプレートのまま測ると通るが、`<PER_PROJECT_LINES>` 等は実値のほうが長いので**埋めると超える**。
#     テンプレート（未記入）: 2,856 バイト
#     公開サンプル（AWS の Bob's Used Bookstore）の値で埋めた実測: 3,934 バイト（余裕 162 バイト）
#   → 5プロジェクト規模でこの余裕である。**プロジェクト数が多い場合は
#     REPOSITORY STRUCTURE を1プロジェクト1行に圧縮する**（役割の説明を削り、
#     TFM / 形式 / NuGet 機構だけを残す。詳細は CCA 自身が出力する）。
#   測り方:
#     python3 -c "
#     import yaml
#     c = yaml.safe_load(open('00-analysis/<repo-id>/transform-config-cca.yaml'))['additionalPlanContext']
#     print(len(c.encode()), 'bytes')"
#
# ⚠️ buildCommand を指定するかどうか
#   移行元が .NET Framework で、作業ホストが macOS / Linux の場合、MSBuild による現行コードの
#   ビルドは原理的に不可能である。**失敗する build command を渡すと分析が無駄に阻害される**ため、
#   その場合は buildCommand を意図的に指定せずソース検査ベースの分析にする。
#   この制約は additionalPlanContext にも明記してエージェントに伝える（下記 CONSTRAINTS 節）。
#   → 同じ制約により「移行元のツールチェーン警告」は取得できない。台帳の供給源が1本減ることを
#     work-plan に明記する（analysis-appendix.md「分析入力」参照）。

codeRepositoryPath: <CODE_REPOSITORY_PATH>          # 記録リポジトリからの相対パス
transformationName: AWS/comprehensive-codebase-analysis

# ⚠️ 移行先スタックは Phase 0b で ADR として決める。**ここで目標バージョンを指定しない。**
#   指定すると分析がその前提に寄り、「その版が作業時点で妥当か」の検討が飛ぶ（DP-1 の失敗様式）。
#   代わりに「現行スタックの棚卸し」と「実行可能な移行先候補の列挙」を要求する。
additionalPlanContext: |
  This repository is <ONE_LINE_DESCRIPTION>, targeting .NET Framework <VERSION>.

  MIGRATION GOAL (context for analysis only; do not perform the migration):
  Move off .NET Framework to a modern cross-platform .NET so it can run on <TARGET_OS>.
  The target .NET version and runtime platform are NOT decided. Do not assume a target
  version and do not present any single version as settled.

  BECAUSE THE TARGET IS UNDECIDED, prioritize these outputs:
  1. CURRENT stack inventory: per-project target framework, project file format (SDK-style vs
     legacy), NuGet mechanism (packages.config vs PackageReference, including mixed states),
     and every dependency with its version.
  2. Every Windows-only / .NET Framework-only dependency that BLOCKS running on Linux. For
     each: file path and line, why it blocks, replacement options on modern .NET, and
     SEPARATELY whether it is DECLARED versus actually USED at runtime -- cite the call sites
     that prove usage, or state that none were found. Do not infer usage from declaration.
     Cover at least: System.Web, HttpContext.Current, ASP.NET MVC 5 (System.Web.Mvc), OWIN
     self-host and Microsoft.Owin.* middleware, Global.asax and App_Start, Web.config plus
     config transforms and ConfigurationManager, System.Drawing/GDI+, Entity Framework 6,
     ASP.NET membership and Windows authentication, System.Web.Optimization bundling, Razor
     .cshtml differences, IIS hosting assumptions, registry access, Windows-only native
     dependencies, PowerShell deployment scripts, and Windows container base images in
     Dockerfile / infrastructure-as-code.
  3. VIABLE migration target candidates (specific modern .NET versions). For each: the
     compatibility chain it forces (which dependencies must change, to which versions) and
     its support stage and end-of-support date. Do not rank by "LTS" alone -- a version can
     be LTS and already in maintenance.
  4. Where behaviour may change SILENTLY (build succeeds, no exception, wrong or empty
     result). Rank these ABOVE items that fail loudly at build time.
  5. Risk ranking and effort per component. For every number you report, state the counting
     rule you used (for example whether partial views and layouts are counted).

  REPOSITORY STRUCTURE (verified by manual inspection; confirm and correct):
  <PER_PROJECT_LINES>

  CONSTRAINTS AFFECTING THE ANALYSIS:
  - <TEST_ASSET_STATUS> <RUNNING_INSTANCE_STATUS>
    State explicitly which behaviours can only be verified by reading code, and where the
    risk of silent behavioural change is highest.
  - External integrations: <EXTERNAL_SERVICES>. Note any configuration switch selecting
    between local and cloud implementations; a defect may surface in only one mode.
  - <BUILD_CONSTRAINT>
  - Report file paths and line numbers for every claim. A claim without a location cannot be
    verified and will be treated as a hypothesis.
